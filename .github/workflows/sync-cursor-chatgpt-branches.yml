name: Sync Cursor ↔ ChatGPT branches

on:
  schedule:
    # Weekly Monday 06:30 UTC drift advisory (after Replit sync window)
    - cron: "30 6 * * 1"
  push:
    branches:
      - chatgpt-main
  workflow_dispatch:
    inputs:
      action:
        description: "Sync step to run"
        required: true
        default: report
        type: choice
        options:
          - report
          - ensure-bridge
          - refresh-from-main
          - handoff-pack

permissions:
  contents: write
  pull-requests: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch sync branches
        run: |
          git fetch origin main chatgpt-main || true
          git branch -r | grep -E 'origin/(chatgpt-main|main)' || true

      - name: Configure git identity
        if: github.event_name == 'workflow_dispatch' && (inputs.action == 'ensure-bridge' || inputs.action == 'refresh-from-main')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bridge report
        if: github.event_name != 'workflow_dispatch' || inputs.action == 'report'
        run: bash scripts/sync-cursor-chatgpt-branches.sh report

      - name: Ensure chatgpt-main exists
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'ensure-bridge'
        run: SYNC_PUSH=1 bash scripts/sync-cursor-chatgpt-branches.sh ensure-bridge

      - name: Refresh chatgpt-main from main
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'refresh-from-main'
        run: SYNC_PUSH=1 bash scripts/sync-cursor-chatgpt-branches.sh refresh-from-main

      - name: Handoff pack
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'handoff-pack'
        run: bash scripts/sync-cursor-chatgpt-branches.sh handoff-pack

      - name: Upload sync report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cursor-chatgpt-branch-sync-report
          path: /tmp/cursor-chatgpt-branch-sync-report/
          if-no-files-found: ignore
