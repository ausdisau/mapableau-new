name: Lint hygiene exact-file autofix

on:
  pull_request:
    paths:
      - .github/workflows/lint-hygiene-autofix.yml

permissions:
  contents: write

jobs:
  autofix:
    if: github.head_ref == 'fix/repository-lint-hygiene'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Fix only the frozen app-rest baseline files
        env:
          ESLINT_CI_LIGHT: "1"
          NODE_OPTIONS: --max-old-space-size=4096
        run: >-
          pnpm exec eslint --fix --max-warnings 0
          'app/(marketing)/home/compare/page.tsx'
          'app/(marketing)/home/find/page.tsx'
          'app/(marketing)/home/page.tsx'
          'app/(marketing)/home/properties/[id]/page.tsx'
          'app/admin/ads/auction/page.tsx'
          'app/admin/ads/ledger/page.tsx'
          'app/admin/ads/page.tsx'
          'app/admin/ads/payments/page.tsx'
          'app/admin/ads/pricing/page.tsx'
          'app/admin/ads/wallets/page.tsx'
          'app/go/page.tsx'
          'app/my/home/page.tsx'
          'app/my/layout.tsx'
          'app/provider-finder/ProviderFinderClient.tsx'
          'app/provider/(console)/ads/new/page.tsx'
          'app/provider/(console)/ads/page.tsx'
          'app/r/ads/[impressionId]/route.ts'
          'app/research/participation/page.tsx'

      - name: Commit exact-file fixes
        shell: bash
        run: |
          if git diff --quiet -- app; then
            echo "No app-rest fixes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- 'app/(marketing)/home/compare/page.tsx' 'app/(marketing)/home/find/page.tsx' 'app/(marketing)/home/page.tsx' 'app/(marketing)/home/properties/[id]/page.tsx' 'app/admin/ads/auction/page.tsx' 'app/admin/ads/ledger/page.tsx' 'app/admin/ads/page.tsx' 'app/admin/ads/payments/page.tsx' 'app/admin/ads/pricing/page.tsx' 'app/admin/ads/wallets/page.tsx' 'app/go/page.tsx' 'app/my/home/page.tsx' 'app/my/layout.tsx' 'app/provider-finder/ProviderFinderClient.tsx' 'app/provider/(console)/ads/new/page.tsx' 'app/provider/(console)/ads/page.tsx' 'app/r/ads/[impressionId]/route.ts' 'app/research/participation/page.tsx'
          git commit -m "fix(lint): clean app-rest import ordering"
          git push origin HEAD:${{ github.head_ref }}
