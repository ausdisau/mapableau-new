name: Security remediation lockfile

on:
  pull_request:
    paths:
      - package.json
      - pnpm-lock.yaml
      - .github/workflows/security-remediation-lockfile.yml

permissions:
  contents: write

concurrency:
  group: security-remediation-lockfile-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  regenerate:
    if: github.head_ref == 'fix/dependency-security-remediation'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Regenerate lockfile only
        run: pnpm install --lockfile-only --no-frozen-lockfile --ignore-scripts

      - name: Commit regenerated lockfile
        shell: bash
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "pnpm-lock.yaml already matches package.json"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore(security): regenerate pnpm lockfile"
          git push origin HEAD:${{ github.head_ref }}
