name: Lint lib exact-file autofix

on:
  pull_request:
    paths:
      - .github/workflows/lint-lib-autofix.yml

permissions:
  contents: write

jobs:
  autofix:
    if: github.head_ref == 'fix/repository-lint-hygiene'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Apply ESLint fixes only to the frozen lib baseline
        env:
          ESLINT_CI_LIGHT: "1"
          NODE_OPTIONS: --max-old-space-size=4096
        shell: bash
        run: |
          pnpm exec eslint --fix \
            lib/access/experience/load-access-exploration.ts \
            lib/access/infrastructure/observation-service.ts \
            lib/access/intelligence-next/evidence/provenance-projection.ts \
            lib/access/intelligence-next/graph/list-projection.ts \
            lib/access/intelligence-next/graph/provenance-projection.ts \
            lib/ads/auction/budget-gate.ts \
            lib/ads/auction/config.ts \
            lib/ads/auction/reserves.ts \
            lib/ads/billing/charge-events.ts \
            lib/ads/billing/stripe-webhook.ts \
            lib/ads/billing/wallet.ts \
            lib/ads/fixtures/synthetic-inventory.ts \
            lib/ads/mediation/provider-router.ts \
            lib/ads/policy/policy-engine.ts \
            lib/ads/providers/ethicalads/ethicalads-adapter.ts \
            lib/ads/providers/google-ad-manager/google-ad-manager-adapter.ts \
            lib/ads/providers/internal/mapable-internal-adapter.ts \
            lib/ads/services/measurement.ts \
            lib/ads/services/resolve-placement.ts \
            lib/ai/navigator/orchestrator.ts \
            lib/ai/platform/context-fabric/freshness.ts \
            lib/ai/platform/context-fabric/provenance.ts \
            lib/ai/platform/context-fabric/routing.ts \
            lib/ai/platform/context-fabric/sources.ts \
            lib/ai/platform/guardian/guardian-service.ts \
            lib/ai/platform/guardian/privacy-gate.ts \
            lib/ai/platform/guardian/processing-router.ts \
            lib/ai/platform/guardian/providers/policy.ts \
            lib/ai/platform/missions/compiler.ts \
            lib/ai/platform/missions/evidence.ts \
            lib/ai/platform/missions/runtime.ts \
            lib/ai/relational/access-tool.ts \
            lib/ai/relational/constitution.ts \
            lib/gais/service/evidence-mapper.ts \
            lib/home/adapters/alexa/alexa-adapter.ts \
            lib/home/adapters/google-home/google-home-adapter.ts \
            lib/home/adapters/matter/matter-adapter.ts \
            lib/home/adapters/simulator/simulator-adapter.ts \
            lib/home/core/action-broker.ts \
            lib/home/core/authority-evaluator.ts \
            lib/home/core/routine-engine.ts \
            lib/home/service.ts \
            lib/labs/contracts/scenario.ts \
            lib/mobile/auth-exchange.ts \
            lib/passport/compatibility-projection.ts \
            lib/research/co-design-governance-service.ts \
            lib/research/consent-separation.ts || true

          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/home/adapters/simulator/simulator-adapter.ts')
          s = p.read_text()
          s = s.replace('  createSyntheticEndpoints,\n', '')
          p.write_text(s)
          PY

      - name: Verify lib shard
        env:
          ESLINT_CI_LIGHT: "1"
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm lint:lib

      - name: Commit lib fixes
        shell: bash
        run: |
          if git diff --quiet -- .eslintrc.cjs lib; then
            echo "No lib fixes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- .eslintrc.cjs lib
          git commit -m "fix(lint): clean lib lint baseline"
          git push origin HEAD:${{ github.head_ref }}
