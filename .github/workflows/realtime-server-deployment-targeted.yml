name: Realtime server deployment targeted

on:
  push:
    branches:
      - fix/vercel-realtime-server-node-deployment

permissions:
  contents: read

jobs:
  targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Run deployment boundary regression test
        run: pnpm exec vitest run tests/deployment/realtime-server-vercel-config.test.ts
