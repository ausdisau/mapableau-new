
name: Mobile CI

on:
  pull_request:
    paths:
      - "apps/mobile/**"
      - "packages/mapable-*/**"
      - "packages/careos-contracts/**"
      - "app/api/v1/mobile/**"
      - "lib/mobile/**"
      - "lib/config/mobile-app.ts"
      - "platform/push/**"
      - "tests/mobile/**"
      - ".github/workflows/mobile-ci.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install with frozen lockfile
        run: pnpm install --frozen-lockfile
      - name: Workspace dependency validation
        run: pnpm list --depth 1 --filter @mapable/mobile
      - name: TypeScript (mobile)
        run: pnpm mobile:type-check
      - name: Unit and contract tests
        run: pnpm exec vitest run tests/mobile
      - name: Expo Doctor
        run: pnpm mobile:doctor
        continue-on-error: true
