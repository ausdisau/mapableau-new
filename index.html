/* MapAble Signal — conservative, deterministic accessibility evidence logic. */
(function (root, factory) {
  const core = factory();
  if (typeof module === 'object' && module.exports) module.exports = core;
  if (root) root.MapAbleCore = core;
})(typeof window !== 'undefined' ? window : null, function () {
  const RATINGS = ['red', 'amber', 'green', 'unknown'];
  const EVIDENCE = ['reported', 'reviewed', 'outdated', 'disputed'];
  function hasEvidence(o) {
    return Boolean(o && String(o.finding || '').trim().length >= 12 &&
      String(o.method || '').trim() && String(o.observedAt || '').trim() &&
      (String(o.measurement || '').trim() || (o.evidenceIds || []).length ||
       (o.method === 'direct observation' && String(o.finding || '').trim().length >= 24)));
  }
  function evidenceRating(o) {
    if (!o || o.notApplicable || o.claimBasis === 'assumption') return 'unknown'; // Neither N/A nor assumptions can be Green.
    if (o.evidenceState !== 'reviewed' || o.moderation !== 'accepted' ||
        !RATINGS.includes(o.proposed) || !hasEvidence(o)) return 'unknown';
    if (o.reviewBy && o.reviewBy < new Date().toISOString().slice(0, 10)) return 'unknown';
    return o.proposed;
  }
  function aggregateJourney(segments, options = {}) {
    const relevant = (segments || []).filter(s => !s.notApplicable);
    if (!relevant.length) return { rating: 'unknown', reason: 'No applicable journey segments are documented.' };
    const ratings = relevant.map(evidenceRating);
    // Incomplete critical links cannot be treated as a confirmed green route.
    if (ratings.includes('unknown')) return { rating: 'unknown', reason: 'One or more links have missing, unreviewed, disputed or outdated evidence.' };
    if (ratings.includes('red')) {
      if (options.verifiedAlternative === true) return { rating: 'amber', reason: 'An evidenced barrier exists, with a verified conditional alternative.' };
      if (options.noVerifiedAlternative === true) return { rating: 'red', reason: 'An evidenced critical route barrier has a documented check showing no verified usable alternative.' };
      return { rating: 'unknown', reason: 'A critical barrier is documented, but possible alternatives have not been sufficiently checked.' };
    }
    if (ratings.includes('amber')) return { rating: 'amber', reason: 'At least one link requires a condition, detour, assistance or adjustment.' };
    return { rating: 'green', reason: 'All recorded applicable links were locally reviewed as green within their recorded scope and dates.' };
  }
  function stripPrivate(o) {
    const c = { ...o };
    delete c.contact; delete c.participantName; delete c.privateNotes;
    delete c.evidenceIds; delete c.files; delete c.latitude; delete c.longitude;
    delete c.latitude2; delete c.longitude2;
    return c;
  }
  function countRatings(items) {
    return (items || []).reduce((acc, o) => { if(o.notApplicable)acc.notApplicable++; else acc[evidenceRating(o)]++; return acc; }, {red:0,amber:0,green:0,unknown:0,notApplicable:0});
  }
  function csvCell(v) {
    const s = String(v == null ? '' : v);
    return '"' + s.replace(/"/g, '""') + '"';
  }
  return {RATINGS, EVIDENCE, hasEvidence, evidenceRating, aggregateJourney, stripPrivate, countRatings, csvCell};
});

</script>

on',`data-id="${esc(o.id)}"`)}${button('Mark outdated','outdate-observation',`data-id="${esc(o.id)}"`)}${button('Withdraw and delete','delete-observation',`data-id="${esc(o.id)}"`,'btn danger sm')}</div></div><div class="stack"><div class="panel"><h2>Location</h2>${syntheticMap([o])}<p class="small">Illustrative X / Y: ${esc(o.x ?? 'Not set')} / ${esc(o.y ?? 'Not set')}; geographic coordinates are private and not exported in redacted reports.</p><p class="small">${o.latitude!==undefined && o.latitude!==''?`Latitude: ${esc(fmtNumber(o.latitude))}, longitude: ${esc(fmtNumber(o.longitude))}`:'No real-world coordinates supplied.'}</p></div><div class="panel"><h2>Local evidence files</h2><p class="small">Files are stored in this browser using IndexedDB. A public report excludes them by default.</p>${(o.evidenceIds||[]).length?o.evidenceIds.map(k=>`<div class="soft" style="margin-bottom:8px"><span>Local attachment: ${esc(k.slice(0,8))}…</span>${button('Save file to device','download-evidence',`data-id="${esc(k)}"`)}</div>`).join(''):'<div class="empty">No files attached. Recorded measurements and observations may still be useful if reviewed.</div>'}</div><div class="panel"><h2>Interpretation rules</h2><p class="small">A suggested Green, Amber or Red cannot become a current signal until the minimum evidence is present and the observation is locally reviewed. Disputed and outdated findings display Unknown. This is not a professional assessment or access guarantee.</p></div></div></div>`;}

cceptance testing is still required.</p><p class="small">If speech is difficult, you can type or use AAC shortcuts. No diagnosis, impairment label or disability proof is required.</p></div></div><div class="panel" style="margin-top:15px"><h2>Governance boundaries</h2><p><strong>Local review is not identity verification.</strong> This standalone build does not have accounts, delegated permissions, server-side moderation, encrypted uploads or published public records. The audit trail shows local actions but can be cleared or modified by someone with browser access.</p><p>Before real community publishing: implement secure authentication, least-privilege human review, participant correction and deletion rights, legally reviewed consent and retention, evidence licensing, abuse triage and escalation, tested accessibility, and explicit opt-in release controls.</p></div>`;}

function makeChallenge(f){const t=refs.templates.find(t=>t.id===f.get('template'));const o={id:id(),title:String(f.get('title')||'').trim(),template:String(f.get('template')||'journey'),boundary:String(f.get('boundary')||'').trim(),focus:String(f.get('focus')||t?.focus||'').trim(),instruction:String(f.get('instruction')||t?.instruction||'').trim(),status:'draft',createdAt:new Date().toISOString(),isSeed:false};if(!o.title||!o.boundary){toast('Title and boundary are required.');return;}store.challenges.unshift(o);ui.challengeId=o.id;audit('Challenge created',o.title+' — local draft');goto('challenge-detail');toast('Local challenge draft created.');}

async function makeObservation(form,decision){const f=new FormData(form);const title=String(f.get('title')||'').trim(),finding=String(f.get('finding')||'').trim();if(!title||finding.length<12||!f.get('confirmLocal')){toast('Provide a feature, a specific observation and local-storage confirmation.');return;}const ch=store.challenges.find(c=>c.id===String(f.get('challengeId')));if(!ch){toast('Select an existing challenge.');return;}if(ch.status==='closed'){toast('This challenge is closed. Reopen a new challenge to add findings.');return;}const o={id:id(),challengeId:ch.id,title,kind:String(f.get('kind')||'place'),claimBasis:String(f.get('obasis')||'observed'),feature:String(f.get('feature')||'Other'),requirement:String(f.get('requirement')||'').trim(),finding,measurement:String(f.get('measurement')||'').trim(),method:String(f.get('method')||'community report'),source:String(f.get('source')||'').trim(),observedAt:String(f.get('observedAt')||today()),reviewBy:String(f.get('reviewBy')||''),proposed:String(f.get('proposed')||'unknown'),evidenceState:'reported',moderation:decision==='submitted'?'submitted':'draft',reviewNote:'',alternative:String(f.get('alternative')||'Not checked'),alternativeVerified:!!f.get('alternativeVerified'),noVerifiedAlternative:!!f.get('noVerifiedAlternative'),urgentHazard:!!f.get('urgentHazard'),notApplicable:!!f.get('notApplicable'),x:readNum(f,'x'),y:readNum(f,'y'),x2:readNum(f,'x2'),y2:readNum(f,'y2'),latitude:readNum(f,'latitude'),longitude:readNum(f,'longitude'),latitude2:readNum(f,'latitude2'),longitude2:readNum(f,'longitude2'),evidenceIds:[],createdAt:new Date().toISOString(),isSeed:false};
if(!validateCoords(o.latitude,-90,90)||!validateCoords(o.latitude2,-90,90)||!validateCoords(o.longitude,-180,180)||!validateCoords(o.longitude2,-180,180)){toast('Check latitude and longitude ranges.');return;}
if(o.alternativeVerified&&o.noVerifiedAlternative){toast('Select either a verified alternative or a checked absence of one, not both.');return;}
if(o.urgentHazard && !confirm('Urgent hazard reports in this demo do not notify an authority or emergency service. You must use the relevant real-world escalation process. Save anyway?'))return;
const files=Array.from(document.getElementById('ofile')?.files||[]);if(files.length>5||files.some(file=>file.size>8*1024*1024)){toast('Choose up to five files, each at most 8 MB.');return;}

function handleReview(form,decision){const f=new FormData(form),o=store.observations.find(o=>o.id===String(f.get('id')));if(!o)return;const note=String(f.get('reviewNote')||'').trim();if(note.length<12){toast('Add a review reason of at least 12 characters.');return;}if(decision==='accept'&&!C.hasEvidence(o)){toast('Missing evidence. Request clarification instead of approving.');return;}
o.reviewNote=note;if(decision==='accept'){o.evidenceState='reviewed';o.moderation='accepted';}if(decision==='needs-info'){o.evidenceState='reported';o.moderation='needs-info';}if(decision==='dispute'){o.evidenceState='disputed';o.moderation='needs-info';}if(decision==='reject'){o.evidenceState='reported';o.moderation='rejected';}o.reviewedAt=new Date().toISOString();audit('Review decision: '+decision,o.title+' — '+note.slice(0,120));render();toast('Local decision recorded: '+labelCase(decision)+'.');}

function updateChallenge(id,status){const c=store.challenges.find(c=>c.id===id);if(!c)return;if(status==='published-local'&&!confirm('Publish this challenge to the LOCAL demo workspace only? This will NOT put the challenge online or contact participants.'))return;c.status=status;audit('Challenge status changed',c.title+' → '+status);render();toast('Challenge status: '+localStatus(c));}
// Attachments: binary data stays in IndexedDB, not localStorage and not on a server.
function openDB(){return new Promise((resolve,reject)=>{if(!window.indexedDB){reject(new Error('IndexedDB unavailable'));return;}const req=indexedDB.open(evidenceDB,1);req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains('files'))req.result.createObjectStore('files');};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);});}
async function putFile(key,file){const db=await openDB();return new Promise((resolve,reject)=>{const tx=db.transaction('files','readwrite');tx.objectStore('files').put({name:file.name,type:file.type||'application/octet-stream',size:file.size,blob:file},key);tx.oncomplete=()=>{db.close();resolve(true);};tx.onerror=()=>{db.close();reject(tx.error);};});}
async function getFile(key){const db=await openDB();return new Promise((resolve,reject)=>{const req=db.transaction('files','readonly').objectStore('files').get(key);req.onsuccess=()=>{db.close();resolve(req.result||null);};req.onerror=()=>{db.close();reject(req.error);};});}
async function deleteFile(key){const db=await openDB();return new Promise((resolve,reject)=>{const tx=db.transaction('files','readwrite');tx.objectStore('files').delete(key);tx.oncomplete=()=>{db.close();resolve();};tx.onerror=()=>{db.close();reject(tx.error);};});}
async function eraseFiles(){const db=await openDB();return new Promise((resolve,reject)=>{const tx=db.transaction('files','readwrite');tx.objectStore('files').clear();tx.oncomplete=()=>{db.close();resolve();};tx.onerror=()=>{db.close();reject(tx.error);};});}
function saveBlob(filename,blob){const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=filename;a.style.display='none';document.body.appendChild(a);a.click();setTimeout(()=>{a.remove();URL.revokeObjectURL(u);},5000);}
function exportText(filename,data,type='text/plain;charset=utf-8'){saveBlob(filename,new Blob([data],{type}));toast(filename+' saved to your device. No server submission.');}
function filenamePart(v){return String(v||'mapable-signal').replace(/[^a-z0-9_-]+/gi,'-').slice(0,45).replace(/^-|-$/g,'').toLowerCase();}
const reportName=()=>`mapable-signal-${today()}`;
function fileToDataUrl(blob){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=()=>reject(reader.error);reader.readAsDataURL(blob);});}
async function exportJson(){const exact=!!store.consents.includeLocation,withFiles=!!store.consents.includeEvidence;const observations=getReportObservations().map(o=>{const item={...o};if(!exact){delete item.latitude;delete item.longitude;delete item.latitude2;delete item.longitude2;}if(!withFiles)delete item.evidenceIds;return item;});const pack={format:'MapAble Signal Local Workspace Export',version:1,exportedAt:new Date().toISOString(),notice:'User-controlled local export. Do not assume verification, accreditation, universal access or compliance.',privacy:{coordinatesIncluded:exact,evidenceIncluded:withFiles},challenges:store.challenges,observations,audit:withFiles||exact?store.audit:[]};if(withFiles){pack.attachments={};for(const o of observations){for(const key of o.evidenceIds||[]){try{const f=await getFile(key);if(f)pack.attachments[key]={name:f.name,type:f.type,size:f.size,dataURL:await fileToDataUrl(f.blob)};}catch(_e){pack.attachments[key]={missing:true};}}}}exportText(`${reportName()}${exact||withFiles?'-private':''}.json`,JSON.stringify(pack,null,2),'application/json');audit('Data exported',`JSON; coordinates: ${exact}; attachments: ${withFiles}; local file only`);}
function exportCsv(){const fields=['Challenge','Observation','Kind','Feature','Requirement','Finding','Measurement','Method','Source','Date','ReviewBy','EvidenceBasis','EvidenceState','LocalModeration','Signal','Limitation','UrgentHazard'];const safe = v => {let text=String(v ?? '');if(/^\s*[=+@\-\t\r]/.test(text))text="'"+text;return C.csvCell(text);};const rows=getReportObservations().map(o=>{const c=store.challenges.find(c=>c.id===o.challengeId);return [c?.title||'',o.title,o.kind,o.feature,o.requirement,o.finding,o.measurement,o.method,o.source,o.observedAt,o.reviewBy,o.claimBasis||'Not recorded',o.evidenceState,o.moderation,C.evidenceRating(o),o.reviewNote,o.urgentHazard?'Escalation required':'Not flagged'].map(safe).join(',');});const text='\ufeff'+fields.map(safe).join(',')+'\r\n'+rows.join('\r\n');exportText(`${reportName()}-redacted.csv`,text,'text/csv;charset=utf-8');audit('Redacted CSV exported',`${rows.length} observations; exact coordinates and file content excluded`);}
function makeReportHtml(){const items=getReportObservations(),counts=C.countRatings(items);const title=ui.reportChallenge&&ui.reportChallenge!=='all'?store.challenges.find(c=>c.id===ui.reportChallenge)?.title:'All local challenges';const rows=items.map(o=>`<tr><th scope="row">${esc(o.title)}</th><td>${esc(o.feature)}</td><td>${esc(o.requirement)}</td><td>${esc(o.claimBasis||'Not stated')}</td><td>${esc(C.evidenceRating(o)).toUpperCase()}</td><td>${esc(o.finding)}</td><td>${esc(o.method)}</td><td>${esc(o.observedAt)}</td><td>${esc(o.evidenceState)}</td><td>${esc(o.reviewNote||'Not locally reviewed')}</td></tr>`).join('');return `<!doctype html><html lang="en-AU"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>MapAble Signal Report — ${esc(title)}</title><style>body{font:16px/1.5 system-ui,sans-serif;color:#182a42;max-width:1200px;margin:30px auto;padding:0 20px}h1{color:#173b63}table{border-collapse:collapse;width:100%;font-size:14px}th,td{border:1px solid #9aaabd;padding:9px;text-align:left;vertical-align:top}thead{background:#e6edf5}table{display:block;overflow:auto}p{max-width:850px}.warning{border:2px solid #9a5a19;background:#fff8eb;padding:14px;margin:18px 0}@media print{body{margin:0}table{display:table;font-size:10px}tr{break-inside:avoid}}</style></head><body><header><p>Australian Disability Ltd · MapAble Signal</p><h1>Community Mapping Challenge evidence report</h1><p><strong>Scope:</strong> ${esc(title)}</p><p><strong>Exported:</strong> ${esc(new Date().toLocaleString('en-AU'))}</p></header><div class="warning"><strong>Important evidence limitation:</strong> This report contains local or synthetic records and is not an accredited accessibility assessment, statutory compliance conclusion, or guarantee of safe access. Unknown means missing, stale, disputed or insufficiently reviewed evidence. All exact coordinates, participant identifiers and attachments have been excluded.</div><p>Observations: ${items.length} | Red: ${counts.red} | Amber: ${counts.amber} | Green: ${counts.green} | Unknown: ${counts.unknown} | Not applicable: ${counts.notApplicable}</p><table><thead><tr><th>Finding</th><th>Feature</th><th>Functional requirement</th><th>Evidence basis</th><th>Signal</th><th>Recorded observation</th><th>Method</th><th>Date</th><th>Evidence</th><th>Limitations / review</th></tr></thead><tbody>${rows}</tbody></table><footer><p>Observed facts are distinguished from community reports, local review and unknowns. A local reviewer is not an independent accredited assessor. Free-text fields may contain identifiable information and must be checked manually before sharing. Corrections and reinspection should retain version history.</p></footer></body></html>`;}
function exportHtml(){exportText(`${reportName()}-report.html`,makeReportHtml(),'text/html;charset=utf-8');audit('HTML report exported','Redacted scope-specific report downloaded.');}
function printReport(){const html=makeReportHtml();const w=window.open('','_blank');if(!w){toast('Pop-up blocked. Download the HTML report instead.');return;}w.document.open();w.document.write(html);w.document.close();w.focus();setTimeout(()=>w.print(),250);audit('Print-ready report opened','No external transmission');}
async function deleteObservation(key){const o=store.observations.find(o=>o.id===key);if(!o)return;if(!confirm(`Withdraw and delete "${o.title}" and its ${o.evidenceIds?.length||0} local evidence file(s)? This cannot be undone.`))return;for(const k of o.evidenceIds||[]){try{await deleteFile(k);}catch(_e){}}store.observations=store.observations.filter(a=>a.id!==key);audit('Observation withdrawn and erased','Record '+key.slice(0,8)+' deleted at participant request; details no longer retained');goto('observe');toast('Observation and its available attachments deleted.');}
async function wipeWorkspace(){if(!confirm('Erase ALL local challenges, observations, evidence files and audit history from this browser? Export a copy first if you need one.'))return;if(!confirm('Final confirmation: erase this local workspace, including the synthetic examples?'))return;try{await eraseFiles();}catch(_e){toast('Some browser evidence files could not be erased; check browser site data.');return;}store={version:1,challenges:[],observations:[],audit:[],prefs:store.prefs,consents:{localStore:true,includeLocation:false,includeEvidence:false}};save();ui.challengeId='';goto('overview');toast('This app workspace was erased from local storage. Browser backups and previously exported copies are outside this app.');}
function handleAction(buttonEl){const act=buttonEl.dataset.action;const k=buttonEl.dataset.id;switch(act){
case 'nav':goto(buttonEl.dataset.view);break;
case 'challenge-detail':ui.challengeId=k;goto('challenge-detail');break;
case 'open-observe':ui.challengeId=k;goto('observe');break;
case 'publish-challenge':updateChallenge(k,'published-local');break;
case 'pause-challenge':updateChallenge(k,'paused');break;
case 'close-challenge':updateChallenge(k,'closed');break;
case 'choose-template':{const t=refs.templates.find(t=>t.id===buttonEl.dataset.template);if(!t)break;document.getElementById('ctemplate').value=t.id;document.getElementById('cfocus').value=t.focus;document.getElementById('cinstruction').value=t.instruction;document.getElementById('ctitle').focus();toast('Template selected. You control the scope and wording.');break;}
case 'observation-detail':ui.selected=k;goto('observation-detail');break;
case 'select-review':ui.selected=k;render();const note=document.getElementById('review-note');if(note)note.focus();break;
case 'submit-observation':updateObservation(k,'submitted');break;
case 'dispute-observation':updateObservation(k,'disputed');break;
case 'outdate-observation':updateObservation(k,'outdated');break;
case 'delete-observation':deleteObservation(k);break;
case 'pin-mode':ui.mapPinTarget=buttonEl.dataset.target;document.getElementById('active-pin-label').textContent=ui.mapPinTarget;toast('Map marker target: '+ui.mapPinTarget+'.');break;
case 'aac-phrase':{const el=document.getElementById('ofinding');if(!el)return;const start=el.selectionStart??el.value.length, end=el.selectionEnd??start;el.value=el.value.slice(0,start)+(start&&el.value[start-1]!==' '? ' ':'')+buttonEl.dataset.phrase+' '+el.value.slice(end);el.focus();el.selectionStart=el.selectionEnd=el.value.length;announce('Phrase inserted; you can edit the text.');break;}
case 'export-csv':exportCsv();break;
case 'export-json':exportJson().catch(()=>toast('Unable to build the requested JSON export.'));break;
case 'export-html':exportHtml();break;
case 'print-report':printReport();break;
case 'export-audit':exportText(`${reportName()}-audit.json`,JSON.stringify({notice:'Local record, not tamper-proof',events:store.audit},null,2),'application/json');break;
case 'download-evidence':getFile(k).then(f=>f?saveBlob(f.name,f.blob):toast('Evidence file no longer available on this device.')).catch(()=>toast('Evidence storage is unavailable.'));break;
case 'wipe-workspace':wipeWorkspace();break;
case 'enable-online-map':{if(!confirm('Enable online OpenStreetMap tiles? Loading Leaflet from a CDN and map tiles sends the viewed map area and network metadata to external services. No observations are automatically submitted. Continue?'))break;ui.onlineMap=true;audit('Online map permitted for this session','User opted into CDN and OpenStreetMap tile requests');render();break;}
case 'disable-online-map':ui.onlineMap=false;render();toast('Online map disabled.');break;
default:break;
}}
async function loadLeaflet(){if(window.L)return; if(ui.leafletPromise)return ui.leafletPromise;ui.leafletPromise=new Promise((resolve,reject)=>{const link=document.createElement('link');link.rel='stylesheet';link.href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';document.head.appendChild(link);const script=document.createElement('script');script.src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';script.onload=resolve;script.onerror=()=>reject(new Error('Leaflet could not load'));document.head.appendChild(script);});return ui.leafletPromise;}
async function mountLiveMap(){const div=document.getElementById('live-map');if(!div)return;try{await loadLeaflet();if(!ui.onlineMap||div!==document.getElementById('live-map'))return;const map=window.L.map(div,{scrollWheelZoom:false}).setView([-33.8688,151.2093],13);ui.leaflet=map;window.L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);const points=store.observations.filter(o=>o.latitude!==''&&o.latitude!=null&&o.longitude!==''&&o.longitude!=null&&Number.isFinite(+o.latitude)&&Number.isFinite(+o.longitude));points.forEach(o=>{window.L.marker([+o.latitude,+o.longitude]).addTo(map).bindPopup(`<strong>${esc(o.title)}</strong><div>${esc(C.evidenceRating(o))} · ${esc(o.evidenceState)}</div>`);});if(points.length)map.setView([+points[0].latitude,+points[0].longitude],14);map.on('click',ev=>{const end=ui.mapPinTarget==='end',lat=ev.latlng.lat.toFixed(6),lon=ev.latlng.lng.toFixed(6);const a=document.getElementById(end?'olat2':'olat'),b=document.getElementById(end?'olon2':'olon');if(a&&b){a.value=lat;b.value=lon;toast('Coordinate added to '+ui.mapPinTarget+' fields.');}});setTimeout(()=>map.invalidateSize(),200);}catch(_e){ui.onlineMap=false;const target=document.getElementById('live-map-container');if(target)target.innerHTML='<p role="status">Online map could not load. Use the illustrative map or coordinate fields.</p>';toast('Online tiles unavailable. The local observation form still works.');}}
document.addEventListener('click',ev=>{const act=ev.target.closest('[data-action]');if(act){ev.preventDefault();handleAction(act);return;}const canvas=ev.target.closest('[data-map-target]');if(canvas){const rect=canvas.getBoundingClientRect();const x=Math.max(0,Math.min(100,((ev.clientX-rect.left)/rect.width)*100)),y=Math.max(0,Math.min(100,((ev.clientY-rect.top)/rect.height)*100));const end=ui.mapPinTarget==='end';const a=document.getElementById(end?'ox2':'ox'),b=document.getElementById(end?'oy2':'oy');if(a&&b){a.value=x.toFixed(1);b.value=y.toFixed(1);toast('Illustrative '+ui.mapPinTarget+' marker: '+x.toFixed(0)+'%, '+y.toFixed(0)+'%.');}}});
document.addEventListener('submit',ev=>{const form=ev.target;const submitter=ev.submitter;const decision=submitter?.value||'draft';if(form.id==='create-challenge'){ev.preventDefault();makeChallenge(new FormData(form));}else if(form.id==='observation-form'){ev.preventDefault();makeObservation(form,decision).catch(()=>toast('Observation could not be saved. Please export existing work and retry.'));}else if(form.id==='review-form'){ev.preventDefault();handleReview(form,decision);}});
document.addEventListener('change',ev=>{const t=ev.target;if(t.id==='ochallenge'){ui.challengeId=t.value;return;}if(t.id==='okind'){ui.observeKind=t.value;return;}if(t.id==='compareA'||t.id==='compareB'){ui[t.id]=t.value;render();return;}if(t.id==='routeChallenge'){ui.challengeId=t.value;render();return;}if(t.id==='reportChallenge'){ui.reportChallenge=t.value;render();return;}const consentKeys={'privacy-coords':'includeLocation','privacy-evidence':'includeEvidence','export-location':'includeLocation','export-evidence':'includeEvidence'};if(Object.prototype.hasOwnProperty.call(consentKeys,t.id)){store.consents[consentKeys[t.id]]=!!t.checked;audit('Private export preference changed',consentKeys[t.id]+' = '+!!t.checked);render();return;}const prefKeys={'pref-contrast':'highContrast','pref-large':'largeText','pref-easy':'easyRead'};if(Object.prototype.hasOwnProperty.call(prefKeys,t.id)){store.prefs[prefKeys[t.id]]=!!t.checked;audit('Communication/display preference changed',prefKeys[t.id]);render();return;}});
render();save();if(location.protocol==='https:'&&'serviceWorker'in navigator&&!window.MAPABLE_SINGLE_FILE){navigator.serviceWorker.register('./sw.js').catch(()=>{});}
})();

</script>
