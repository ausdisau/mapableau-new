# Panoramax API — reference compose for Coolify / docker
# VERIFY image tag at deploy time — prefer non-latest pinned version

services:
  panoramax-api:
    image: panoramax/api:latest  # pin tag at deploy, e.g. panoramax/api:1.2.3
    ports:
      - "${PANORAMAX_API_PORT:-8080}:8080"
    environment:
      FS_URL: ${PANORAMAX_FS_URL}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
